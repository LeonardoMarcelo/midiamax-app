name: MidiaMax — publicar imagem

# Builda a imagem de producao da MidiaMax e publica no GHCR.
#
# Por que nao usamos o release-docker.yml do upstream: ele dispara em tags
# 'v*.*.*' (as deles) e nao passa VITE_APP_NAME nem o host do Reverb, entao o
# bundle sairia com a marca TryPost e o websocket apontando para localhost.
# Nossas tags sao 'mm-v*' justamente para nao colidir com o workflow deles.
#
# Configurar em Settings > Secrets and variables > Actions:
#   vars.APP_NAME           ex.: MidiaMax
#   vars.APP_DOMAIN         ex.: app.midiamax.com.br   (host do websocket)
#   secrets.REVERB_APP_KEY  a mesma chave usada no compose de producao

on:
  push:
    tags: ['mm-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build e push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nome da imagem em minusculas
        id: img
        run: printf 'name=%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Avisar se o dominio nao esta configurado
        if: vars.APP_DOMAIN == ''
        run: echo "::warning::vars.APP_DOMAIN vazio — o bundle sai com VITE_REVERB_HOST=localhost e o websocket nao conecta em producao."

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: linux/amd64 # VPS e amd64; adicionar linux/arm64 se mudar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_NAME=${{ vars.APP_NAME || 'MidiaMax' }}
            VITE_REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ vars.APP_DOMAIN || 'localhost' }}
            VITE_REVERB_PORT=443
            VITE_REVERB_SCHEME=https
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo '```'
            echo "$IMAGE_TAGS"
            echo '```'
            echo
            printf 'Deploy: `scripts/deploy.sh %s` no repo midiamax-infra.\n\n' "$GITHUB_REF_NAME"
            printf 'O label `org.opencontainers.image.revision` carrega o commit (`%s`);\n' "$GITHUB_SHA"
            printf 'o deploy le esse label e preenche MIDIAMAX_COMMIT — obrigacao AGPL secao 13.\n'
          } >> "$GITHUB_STEP_SUMMARY"
